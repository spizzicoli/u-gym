workflows:
  ios-unsigned:
    name: U-GYM iOS (AltServer)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Install dependencies and build web app
        script: |
          npm ci
          npm run build
      - name: Create and sync iOS project
        script: |
          npx cap add ios
          npx cap sync ios
          npx capacitor-assets generate --ios --iconBackgroundColor '#111214' --splashBackgroundColor '#111214'
          test -f ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          cd ios/App
          pod install
      - name: Build unsigned iOS app
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA for AltServer
        script: |
          APP_PATH=build/ios/Build/Products/Release-iphoneos/App.app
          if [ ! -d "$APP_PATH" ]; then
            echo "App.app non trovato nel prodotto Xcode"
            exit 1
          fi
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "Info.plist non trovato in App.app"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          mkdir -p build/unsigned-ipa/Payload
          cp -R "$APP_PATH" build/unsigned-ipa/Payload/App.app
          cd build/unsigned-ipa
          zip -qry ../U-GYM-AltServer.ipa Payload
          unzip -t ../U-GYM-AltServer.ipa
    artifacts:
      - build/U-GYM-AltServer.ipa
